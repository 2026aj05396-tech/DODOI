# Continuous integration for every pull request and every push to main (roadmap P0-09).
# One job keeps GitHub Actions minutes low on the private repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dodoi
          POSTGRES_PASSWORD: dodoi
          POSTGRES_DB: dodoi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dodoi -d dodoi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Automated test runs use APP_ENV=local and the throwaway CI database (SYSTEM_ARCHITECTURE §13).
      APP_ENV: local
      DATABASE_URL: postgresql://dodoi:dodoi@localhost:5432/dodoi_test?schema=public
      TEST_DATABASE_URL: postgresql://dodoi:dodoi@localhost:5432/dodoi_test?schema=public
      # Throwaway values for tests only: no real Google client is ever contacted in CI.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3100
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret
      # No Resend key in CI: emails are skipped (allowed only with APP_ENV=local).
      EMAIL_FROM: dodoi <ci@example.test>
      # Fake Cloudinary values: tests never contact Cloudinary.
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-key
      CLOUDINARY_API_SECRET: ci-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component and integration tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
