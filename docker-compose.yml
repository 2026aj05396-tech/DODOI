# Local development services. Only PostgreSQL for now (SYSTEM_ARCHITECTURE §13).
services:
  db:
    # TODO(P0-03 follow-up): move to postgres:18.3-alpine (volume at /var/lib/postgresql) once Docker can stop containers on the dev machine.
    image: postgres:16-alpine
    container_name: dodoi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dodoi
      POSTGRES_PASSWORD: dodoi
      POSTGRES_DB: dodoi
    # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - dodoi-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodoi -d dodoi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dodoi-db-data:
